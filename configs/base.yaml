sample:
  start_date: "2000-01-01"
  end_date: "2025-12-31"
  require_ccm: true
  common_stock_only: true
  exclude_financials: true
  financial_sic_min: 6000
  financial_sic_max: 6999
  annual_filters: {indfmt: "INDL", datafmt: "STD", consol: "C"}
availability:
  # A current Compustat snapshot cannot establish that every final field was
  # visible on PDATE. PDATE is audit-only; it never drives trading.
  priority: ["fdate", "datadate_plus_6_months"]
  missing_fdate_lag_months: 6
  execution_lag_sessions: 1
universe:
  microcap_percentiles: [0.25, 0.50, 0.75]
  market_cap_lag_sessions: 1
portfolio:
  winsor_lower: 0.01
  winsor_upper: 0.99
  gross_exposure: 1.0
  rebalance_frequency: "daily" # daily | weekly | monthly
  weight_method: "zscore" # zscore | rank | quintile
  # null: one global cross-section; 1: score within the configured SIC divisions.
  sic_level: null
  return_field: "DlyRet"
  transaction_cost_bps: 0.0
  newey_west_lags: 5
  nonzero_weight_tolerance: 1.0e-12
industry_grouping:
  # Kept only as a data-mapping reference.  Scoring uses `sic_level` above.
  name: null
  mapping_file: "configs/industry_groupings.yaml"
  group_weighting: "global_gross"
grid:
  # Cartesian product to write into one cache.  Extend this list without
  # changing the weighting or portfolio code.
  microcap_percentiles: [0.25, 0.50, 0.75]
  sic_levels: [null, 1]
engine:
  # Input and weight caches live on the internal SSD Docker volume.
  wide_cache_root: "/cache/wide"
  weight_cache_root: "/cache/weight_cache"
  weight_cache_version: "v2"
  # Four independent one-thread caches fit the four CPUs exposed to Docker.
  cache_workers: 4
  cache_threads_per_worker: 1
paths:
  crsp_daily_zip: "/data/raw/CRSP/Daily Stock File_csv.zip"
  compustat_annual_zip: "/data/raw/Compustat/Annual/Compustat_Annual5026.csv.zip"
  ccm_csv: "/data/raw/CCM/ccm_link(2026).csv"
  signal_catalog: "/data/raw/signal-laboratory-main/paper/data/signal_catalog.json"
  derived_root: "/workspace/data/derived"
