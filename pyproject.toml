[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-signal-backtest"
version = "0.1.0"
description = "PIT-aware daily CRSP-Compustat signal backtesting"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1,<2", "jupyterlab>=4.3,<5", "matplotlib>=3.9,<4", "numpy>=2.1,<3", "pandas>=2.2,<3", "pyarrow>=18,<20", "pyyaml>=6,<7", "scipy>=1.14,<2", "statsmodels>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["src"]
