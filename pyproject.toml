[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "us-equities-signal-research"
version = "0.1.0"
description = "Independent PIT daily-signal research pipeline"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1,<2",
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "polars>=1.20,<2",
  "pyarrow>=18,<20",
]

[tool.setuptools.packages.find]
where = ["src"]
